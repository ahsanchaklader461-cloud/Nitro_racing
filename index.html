<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nitro Rush</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;padding:0;height:100%;width:100%;background:#12151d;color:#fff;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
#app{position:relative;width:100%;height:100%;touch-action:none;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;pointer-events:none}
.ov button,.pn{pointer-events:auto}
button{font:inherit;font-weight:800;color:#fff;border:0;cursor:pointer;text-shadow:0 2px 4px #0008;-webkit-tap-highlight-color:transparent}
.or{background:linear-gradient(#ff9a3c,#f26b0f)}.bl{background:linear-gradient(#2f80e8,#1757b0)}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;font-weight:800;font-size:18px}
.chip{background:#14161ccc;padding:7px 12px;border-radius:6px;font-style:italic}
#cn{position:absolute;top:54px;left:0;right:0;text-align:center;font-size:36px;font-weight:900;font-style:italic}
.arr{position:absolute;top:50%;width:50px;height:50px;margin-top:-25px;border-radius:50%;font-size:30px;background:#14161caa}
#pv{left:8px}#nx{right:8px}
.bot{position:absolute;left:10px;right:10px;bottom:20px;display:flex;gap:10px;align-items:center;justify-content:space-between}
#play{padding:14px 34px;font-size:22px;border-radius:6px;width:100%}
#exit{position:absolute;left:10px;top:56px;padding:8px 12px;border-radius:5px;font-size:13px}
#nit{position:absolute;right:14px;bottom:22px;width:80px;height:80px;border-radius:50%;font-size:14px;box-shadow:0 0 0 4px #fff4}
.ctrl-zone{position:absolute;bottom:0;width:50%;height:60%;pointer-events:auto}
#left-zone{left:0}#right-zone{right:0}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0b0d12ea;padding:22px;border-radius:10px;text-align:center;min-width:240px;pointer-events:auto}
.box h1{margin:0 0 8px;color:#ffd23f}.box button{margin-top:12px;padding:12px 24px;border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="ov" hidden>
    <div class="top"><span class="chip" id="sc">0 m</span><span style="flex:1"></span><span class="chip" id="sp">0 km/h</span></div>
    <button class="bl" id="exit">&lsaquo; GARAGE</button>
    <div id="left-zone" class="ctrl-zone"></div>
    <div id="right-zone" class="ctrl-zone"></div>
    <button class="or" id="nit">NITRO</button>
  </div>
  <div id="garage" class="ov">
    <div class="top"><span class="chip" id="gm">GEMS: 0</span><span style="flex:1"></span><span class="chip" id="bs">BEST: 0m</span></div>
    <div id="cn">RUSH</div>
    <button class="arr" id="pv">&lsaquo;</button><button class="arr" id="nx">&rsaquo;</button>
    <div class="bot"><button class="or" id="play">PLAY</button></div>
  </div>
  <div id="msg" class="ov" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const app = $('app'), hud =$('hud'), gar = $('garage'), msg =$('msg'), sc = $('sc'), spd =$('sp');

const CARS = [
  {n: 'RUSH', col: 0xe63946, spd: 0.8},
  {n: 'VIPER', col: 0x1e90ff, spd: 1.0},
  {n: 'PHANTOM', col: 0xffc300, spd: 1.2}
];
let carIdx = 0, distance = 0, speed = 0, isNitro = false, steer = 0;
let state = 'garage', bestScore = 0;

const R = new THREE.WebGLRenderer({antialias: true});
R.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
app.insertBefore(R.domElement, app.firstChild);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x12151d, 20, 120);
const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 500);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 20, 10);
scene.add(sun);

// Road
const roadGeo = new THREE.PlaneGeometry(12, 1000);
const roadMat = new THREE.MeshBasicMaterial({color: 0x222225});
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
scene.add(road);

// Car Generator
function createCarMesh(color) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 3.2), new THREE.MeshStandardMaterial({color}));
  body.position.y = 0.5;
  group.add(body);
  const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 12);
  const wheelMat = new THREE.MeshBasicMaterial({color: 0x111111});
  for (let x of [-0.9, 0.9]) {
    for (let z of [-1, 1]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(x, 0.3, z);
      group.add(w);
    }
  }
  return group;
}

let playerCar = createCarMesh(CARS[carIdx].col);
scene.add(playerCar);

// Traffic
const traffic = [];
function spawnTraffic() {
  for(let i=0; i<8; i++) {
    const tCar = createCarMesh(0x555555);
    tCar.position.set((Math.random() - 0.5) * 8, 0, -30 - i * 30);
    scene.add(tCar);
    traffic.push(tCar);
  }
}
spawnTraffic();

function updateGarageUI() {
  $('cn').innerText = CARS[carIdx].n;
  $('bs').innerText = 'BEST: ' + Math.floor(bestScore) + 'm';
  scene.remove(playerCar);
  playerCar = createCarMesh(CARS[carIdx].col);
  scene.add(playerCar);
}

function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  R.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// Touch Controls
$('left-zone').addEventListener('touchstart', (e) => { e.preventDefault(); steer = -1; });$('left-zone').addEventListener('touchend', () => steer = 0);
$('right-zone').addEventListener('touchstart', (e) => { e.preventDefault(); steer = 1; });$('right-zone').addEventListener('touchend', () => steer = 0);

// Keyboard Controls
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') steer = -1;
  if (e.key === 'ArrowRight' || e.key === 'd') steer = 1;
});
window.addEventListener('keyup', () => steer = 0);

const nitBtn = $('nit');
nitBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isNitro = true; });
nitBtn.addEventListener('touchend', () => isNitro = false);
nitBtn.addEventListener('mousedown', () => isNitro = true);
nitBtn.addEventListener('mouseup', () => isNitro = false);

function resetGame() {
  distance = 0;
  speed = 0;
  playerCar.position.set(0, 0, 0);
  traffic.forEach((t, i) => {
    t.position.set((Math.random() - 0.5) * 8, 0, -30 - i * 30);
  });
  msg.hidden = true;
}

$('play').onclick = () => {
  state = 'play';
  gar.hidden = true; hud.hidden = false;
  resetGame();
};

$('exit').onclick = () => {
  state = 'garage';
  gar.hidden = false; hud.hidden = true;
  msg.hidden = true;
};

$('pv').onclick = () => { carIdx = (carIdx + CARS.length - 1) \% CARS.length; updateGarageUI(); };$('nx').onclick = () => { carIdx = (carIdx + 1) % CARS.length; updateGarageUI(); };

let lastT = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;

  if (state === 'garage') {
    playerCar.rotation.y += dt * 0.8;
    playerCar.position.set(0, 0, 0);
    cam.position.set(0, 2, 6); cam.lookAt(0, 0, 0);
  } else if (state === 'play') {
    playerCar.rotation.y = 0;
    const targetSpeed = CARS[carIdx].spd * (isNitro ? 1.8 : 1.0);
    speed += (targetSpeed - speed) * 0.05;
    distance += speed * 40 * dt;

    playerCar.position.x += steer * 8 * dt;
    playerCar.position.x = Math.max(-4.5, Math.min(4.5, playerCar.position.x));

    road.position.z = playerCar.position.z - 200;

    traffic.forEach(t => {
      t.position.z += speed * 20 * dt;
      if (t.position.z > playerCar.position.z + 10) {
        t.position.z = playerCar.position.z - 200 - Math.random() * 50;
        t.position.x = (Math.random() - 0.5) * 8;
      }
      // Collision check
      if (Math.abs(t.position.z - playerCar.position.z) < 2.5 && Math.abs(t.position.x - playerCar.position.x) < 1.2) {
        state = 'gameover';
        if (distance > bestScore) bestScore = distance;
        msg.hidden = false;
        msg.innerHTML = `<div class="box"><h1>CRASHED!</h1><p>Distance: ${Math.floor(distance)}m</p><button id="retry" class="or">RETRY</button></div>`;
        $('retry').onclick = () => { resetGame(); state = 'play'; };
      }
    });

    sc.innerText = Math.floor(distance) + ' m';
    spd.innerText = Math.floor(speed * 180) + ' km/h';

    cam.position.set(playerCar.position.x * 0.3, 3, playerCar.position.z + 7);
    cam.lookAt(playerCar.position.x, 0.5, playerCar.position.z - 5);
  }
  R.render(scene, cam);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
